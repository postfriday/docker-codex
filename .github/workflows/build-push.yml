name: Build and Push Image

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      release_id:
        description: Exact release tag vX.Y.Z (also select this tag as the workflow ref)
        required: true
        type: string

concurrency:
  group: docker-codex-release
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
      packages: write
      issues: write
      actions: read
      id-token: write
      attestations: write
      security-events: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      RELEASE_ID: ${{ inputs.release_id || github.ref_name }}
    steps:
      # Run the coordinator from the default branch; it validates and checks out
      # the exact release SHA before building. Old tags need not contain this code.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Preserve coordinator across release checkout
        run: cp -R scripts/release "$RUNNER_TEMP/release-coordinator"
      - name: Register publishing attempt
        run: python3 "$RUNNER_TEMP/release-coordinator/automation.py" begin
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Install registry client
        run: go install github.com/google/go-containerregistry/cmd/crane@v0.20.3
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.69.3
          cache: true
      - name: Restore candidate and verify both platforms
        id: candidate
        run: python3 "$RUNNER_TEMP/release-coordinator/automation.py" prepare
      - name: Attest candidate provenance
        if: steps.candidate.outputs.done != 'true' && steps.candidate.outputs.attest == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.candidate.outputs.image }}
          subject-digest: ${{ steps.candidate.outputs.digest }}
          push-to-registry: true
      - name: Verify evidence and publish exact digest
        if: steps.candidate.outputs.done != 'true'
        run: python3 "$RUNNER_TEMP/release-coordinator/automation.py" finish
      - name: Record failed attempt
        if: failure()
        run: python3 "$RUNNER_TEMP/release-coordinator/automation.py" fail
